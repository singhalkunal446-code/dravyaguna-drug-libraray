<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dravyaguna Drug Library</title>
<style>
:root{--bg:#f5f7f2;--card:#fff;--ink:#17221a;--muted:#68736b;--accent:#2f6848;--line:#dce6dd;--soft:#e9f2eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}header{background:linear-gradient(135deg,#214d35,#4d7c5e);color:#fff;padding:42px 6vw}h1{font-size:clamp(30px,5vw,52px);margin:0 0 8px}header p{margin:0;opacity:.9}.wrap{max-width:1180px;margin:auto;padding:28px 5vw}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.search{flex:1;min-width:260px}input{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;font:inherit;width:100%}.count{color:var(--muted);margin:8px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px #1937220c;cursor:pointer}.card:hover{transform:translateY(-2px)}.photo{width:100%;height:220px;object-fit:cover;border-radius:13px;background:var(--soft)}h2{margin:8px 0 4px}.botanical{font-style:italic;color:var(--muted)}.tag{display:inline-block;background:var(--soft);color:var(--accent);padding:5px 9px;border-radius:999px;margin:10px 5px 0 0;font-size:12px;font-weight:700}.preview{color:var(--muted);line-height:1.55;margin-top:12px}#detail{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:20px}.back{border:1px solid var(--line);background:#fff;color:var(--accent);padding:9px 13px;border-radius:10px;cursor:pointer}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0}.gallery img{width:100%;height:250px;object-fit:cover;border-radius:13px}.caption{font-size:12px;color:var(--muted);margin-top:6px}.row{display:grid;grid-template-columns:180px 1fr;gap:15px;border-bottom:1px solid #edf1ed;padding:11px 0;line-height:1.55}.label{font-weight:800;color:var(--accent)}footer{text-align:center;color:var(--muted);padding:30px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🌿 Dravyaguna Drug Library</h1><p>A growing BAMS reference library for Ayurvedic medicinal drugs.</p></header>
<div class="wrap"><div class="toolbar"><input id="search" class="search" placeholder="Search drug, Sanskrit, botanical name, Rasa, Karma, indication..."></div><div id="detail"></div><div class="count" id="count"></div><div class="grid" id="grid"></div></div>
<footer>Dravyaguna Drug Library • Initial collection: Guduchi &amp; Yaṣṭimadhu</footer>
<script>
const state={drugs:[],q:""};
const search=document.getElementById('search');
search.addEventListener('input',()=>{state.q=search.value.toLowerCase();render()});
async function load(){try{const r=await fetch('data/drugs.json');state.drugs=await r.json();render()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">Could not load the drug database.</div>'}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function matches(d){return JSON.stringify(d).toLowerCase().includes(state.q)}
function render(){const list=state.drugs.filter(matches);document.getElementById('count').textContent=`${list.length} drug${list.length===1?'':'s'} in library`;document.getElementById('grid').innerHTML=list.map((d,i)=>`<article class="card" onclick="detail(${i})">${d.images?.[0]?`<img class="photo" src="${esc(d.images[0].url)}" alt="${esc(d.images[0].caption)}">`:''}<h2>${esc(d.name)}</h2><div class="botanical">${esc(d.sanskrit)} • ${esc(d.botanicalName)}</div><span class="tag">${esc(d.family)}</span><span class="tag">${esc(d.partUsed)}</span><div class="preview"><b>Rasa:</b> ${esc(d.rasa?.join(', '))}<br><b>Key Karma:</b> ${esc(d.karma?.join(', '))}</div></article>`).join('')||'<div class="empty">No matching drug found.</div>'}
function detail(i){const d=state.drugs.filter(matches)[i],el=document.getElementById('detail');if(!d)return;const fields=[['Sanskrit',d.sanskrit],['Synonyms',d.synonyms?.join(', ')],['Common names',d.commonNames?.join(', ')],['Botanical name',d.botanicalName],['Family',d.family],['Habit',d.habit],['Part used',d.partUsed],['Rasa',d.rasa?.join(', ')],['Guna',d.guna?.join(', ')],['Virya',d.virya],['Vipaka',d.vipaka],['Prabhava',d.prabhava],['Dosha Karma',d.doshaKarma],['Key Karma',d.karma?.join(', ')],['Indications',d.indications?.join('; ')],['Practical identification',d.identification],['Spotter tip',d.spotter],['Formulations',d.formulations?.join('; ')],['Dose',d.dose],['Anupana',d.anupana],['Constituents',d.constituents?.join(', ')],['Modern notes',d.modern],['Safety',d.safety],['Research gaps',d.researchGaps?.join('; ')],['Classical references',d.classicalReferences],['Modern references',d.modernReferences?.join('; ')]];el.innerHTML=`<button class="back" onclick="closeDetail()">← Back to library</button><h2>${esc(d.name)}</h2>${d.images?.length?`<div class="gallery">${d.images.map(x=>`<div><img src="${esc(x.url)}" alt="${esc(x.caption)}"><div class="caption">${esc(x.caption)}<br>${esc(x.credit)}</div></div>`).join('')}</div>`:''}${fields.map(([a,b])=>`<div class="row"><div class="label">${esc(a)}</div><div>${esc(b)}</div></div>`).join('')}`;el.style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
function closeDetail(){document.getElementById('detail').style.display='none'}
load();
</script></body></html>
