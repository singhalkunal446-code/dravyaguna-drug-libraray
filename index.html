<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dravyaguna Drug Library</title>
<style>
:root{--bg:#f5f7f2;--card:#fff;--ink:#17221a;--muted:#68736b;--accent:#2f6848;--line:#dce6dd;--soft:#e9f2eb;--danger:#a33b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}header{background:linear-gradient(135deg,#214d35,#4d7c5e);color:#fff;padding:42px 6vw}h1{font-size:clamp(30px,5vw,52px);margin:0 0 8px}header p{margin:0;opacity:.9}.wrap{max-width:1180px;margin:auto;padding:28px 5vw}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.search{flex:1;min-width:260px}input,textarea,select{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;font:inherit;width:100%}textarea{min-height:90px;resize:vertical}.btn{border:1px solid var(--line);background:#fff;color:var(--accent);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.count{color:var(--muted);margin:8px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px #1937220c;cursor:pointer}.card:hover{transform:translateY(-2px)}.photo{width:100%;height:220px;object-fit:cover;border-radius:13px;background:var(--soft)}h2{margin:8px 0 4px}.botanical{font-style:italic;color:var(--muted)}.tag{display:inline-block;background:var(--soft);color:var(--accent);padding:5px 9px;border-radius:999px;margin:10px 5px 0 0;font-size:12px;font-weight:700}.preview{color:var(--muted);line-height:1.55;margin-top:12px}.card-actions{display:flex;gap:8px;margin-top:14px}.card-actions .btn{flex:1}#detail{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:20px}.back{border:1px solid var(--line);background:#fff;color:var(--accent);padding:9px 13px;border-radius:10px;cursor:pointer}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0}.gallery img{width:100%;height:250px;object-fit:cover;border-radius:13px}.caption{font-size:12px;color:var(--muted);margin-top:6px}.row{display:grid;grid-template-columns:180px 1fr;gap:15px;border-bottom:1px solid #edf1ed;padding:11px 0;line-height:1.55}.label{font-weight:800;color:var(--accent)}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:22px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.form-actions{display:flex;gap:10px;margin-top:14px}.hint{color:var(--muted);font-size:13px;margin-top:6px}.empty{padding:30px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:30px}@media(max-width:650px){.row{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🌿 Dravyaguna Drug Library</h1><p>A growing BAMS reference library for Ayurvedic medicinal drugs.</p></header>
<div class="wrap">
<div class="toolbar"><input id="search" class="search" placeholder="Search drug, Sanskrit, botanical name, Rasa, Karma, indication..."><button class="btn primary" onclick="openForm()">＋ Add Drug</button></div>
<div id="formPanel" class="panel" style="display:none"><h2 id="formTitle">Add Drug</h2><div class="formgrid">
<input id="f_name" placeholder="Drug name *"><input id="f_sanskrit" placeholder="Sanskrit name"><input id="f_botanicalName" placeholder="Botanical name"><input id="f_family" placeholder="Family"><input id="f_partUsed" placeholder="Part used"><input id="f_habit" placeholder="Habit"><input id="f_rasa" placeholder="Rasa (comma separated)"><input id="f_guna" placeholder="Guna (comma separated)"><input id="f_virya" placeholder="Virya"><input id="f_vipaka" placeholder="Vipaka"><input id="f_prabhava" placeholder="Prabhava"><input id="f_doshaKarma" placeholder="Dosha Karma"><input id="f_karma" placeholder="Karma (comma separated)"><input id="f_indications" placeholder="Indications (comma separated)"><textarea id="f_identification" class="full" placeholder="Practical identification"></textarea><textarea id="f_formulations" class="full" placeholder="Formulations (comma separated)"></textarea><textarea id="f_dose" class="full" placeholder="Dose"></textarea><textarea id="f_anupana" class="full" placeholder="Anupana"></textarea><textarea id="f_constituents" class="full" placeholder="Constituents (comma separated)"></textarea><textarea id="f_modern" class="full" placeholder="Modern notes"></textarea><textarea id="f_safety" class="full" placeholder="Safety"></textarea><textarea id="f_classicalReferences" class="full" placeholder="Classical references"></textarea><textarea id="f_images" class="full" placeholder="Image URLs (one per line)"></textarea></div><div class="form-actions"><button class="btn primary" onclick="saveDrug()">Save Drug</button><button class="btn" onclick="closeForm()">Cancel</button></div><div class="hint">Edits/deletions are saved in this browser. A shared permanent database requires a backend/admin authentication setup.</div></div>
<div id="detail"></div><div class="count" id="count"></div><div class="grid" id="grid"></div></div>
<footer>Dravyaguna Drug Library • Guduchi &amp; Yaṣṭimadhu • Edit/Delete enabled</footer>
<script>
const state={drugs:[],q:"",editingId:null};
const search=document.getElementById('search');
search.addEventListener('input',()=>{state.q=search.value.toLowerCase();render()});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const storageKey='dravyaguna-library-overrides-v1';
async function load(){try{const r=await fetch('data/drugs.json');const base=await r.json();const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');const deleted=saved.deleted||[];const edits=saved.edits||{};state.drugs=base.filter(d=>!deleted.includes(d.id)).map(d=>edits[d.id]?({...d,...edits[d.id]}):d);Object.keys(edits).filter(id=>!base.some(d=>d.id===id)&&!deleted.includes(id)).forEach(id=>state.drugs.push(edits[id]));render()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">Could not load the drug database.</div>'}}
function matches(d){return JSON.stringify(d).toLowerCase().includes(state.q)}
function render(){const list=state.drugs.filter(matches);document.getElementById('count').textContent=`${list.length} drug${list.length===1?'':'s'} in library`;document.getElementById('grid').innerHTML=list.map(d=>`<article class="card"><div onclick="detail('${esc(d.id)}')">${d.images?.[0]?`<img class="photo" src="${esc(d.images[0].url)}" alt="${esc(d.images[0].caption)}">`:''}<h2>${esc(d.name)}</h2><div class="botanical">${esc(d.sanskrit)} • ${esc(d.botanicalName)}</div><span class="tag">${esc(d.family)}</span><span class="tag">${esc(d.partUsed)}</span><div class="preview"><b>Rasa:</b> ${esc(d.rasa?.join(', '))}<br><b>Key Karma:</b> ${esc(d.karma?.join(', '))}</div></div><div class="card-actions"><button class="btn" onclick="editDrug('${esc(d.id)}')">✏️ Edit</button><button class="btn danger" onclick="deleteDrug('${esc(d.id)}')">🗑️ Delete</button></div></article>`).join('')||'<div class="empty">No matching drug found.</div>'}
function detail(id){const d=state.drugs.find(x=>x.id===id),el=document.getElementById('detail');if(!d)return;const fields=[['Sanskrit',d.sanskrit],['Synonyms',d.synonyms?.join(', ')],['Common names',d.commonNames?.join(', ')],['Botanical name',d.botanicalName],['Family',d.family],['Habit',d.habit],['Part used',d.partUsed],['Rasa',d.rasa?.join(', ')],['Guna',d.guna?.join(', ')],['Virya',d.virya],['Vipaka',d.vipaka],['Prabhava',d.prabhava],['Dosha Karma',d.doshaKarma],['Key Karma',d.karma?.join(', ')],['Indications',d.indications?.join('; ')],['Practical identification',d.identification],['Spotter tip',d.spotter],['Formulations',d.formulations?.join('; ')],['Dose',d.dose],['Anupana',d.anupana],['Constituents',d.constituents?.join(', ')],['Modern notes',d.modern],['Safety',d.safety],['Research gaps',d.researchGaps?.join('; ')],['Classical references',d.classicalReferences],['Modern references',d.modernReferences?.join('; ')]];el.innerHTML=`<button class="back" onclick="closeDetail()">← Back to library</button><h2>${esc(d.name)}</h2><div class="card-actions"><button class="btn" onclick="editDrug('${esc(d.id)}')">✏️ Edit this drug</button><button class="btn danger" onclick="deleteDrug('${esc(d.id)}')">🗑️ Delete this drug</button></div>${d.images?.length?`<div class="gallery">${d.images.map(x=>`<div><img src="${esc(x.url)}" alt="${esc(x.caption)}"><div class="caption">${esc(x.caption)}<br>${esc(x.credit)}</div></div>`).join('')}</div>`:''}${fields.map(([a,b])=>`<div class="row"><div class="label">${esc(a)}</div><div>${esc(b)}</div></div>`).join('')}`;el.style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
function closeDetail(){document.getElementById('detail').style.display='none'}
function openForm(d=null){state.editingId=d?.id||null;document.getElementById('formTitle').textContent=d?'Edit Drug':'Add Drug';const ids=['name','sanskrit','botanicalName','family','partUsed','habit','rasa','guna','virya','vipaka','prabhava','doshaKarma','karma','indications','identification','formulations','dose','anupana','constituents','modern','safety','classicalReferences','images'];ids.forEach(k=>{const el=document.getElementById('f_'+k);if(!el)return;let v=d?.[k]??'';if(Array.isArray(v))v=v.join(k==='images'?'\n':', ');if(k==='images'&&Array.isArray(d?.images))v=d.images.map(x=>x.url).join('\n');el.value=v});document.getElementById('formPanel').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
function closeForm(){document.getElementById('formPanel').style.display='none';state.editingId=null}
function editDrug(id){const d=state.drugs.find(x=>x.id===id);if(d)openForm(d)}
function saveDrug(){const name=document.getElementById('f_name').value.trim();if(!name){alert('Drug name is required.');return}const id=state.editingId||name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const get=k=>document.getElementById('f_'+k).value.trim();const d={id,name,sanskrit:get('sanskrit'),botanicalName:get('botanicalName'),family:get('family'),partUsed:get('partUsed'),habit:get('habit'),rasa:arr(get('rasa')),guna:arr(get('guna')),virya:get('virya'),vipaka:get('vipaka'),prabhava:get('prabhava'),doshaKarma:get('doshaKarma'),karma:arr(get('karma')),indications:arr(get('indications')),identification:get('identification'),formulations:arr(get('formulations')),dose:get('dose'),anupana:get('anupana'),constituents:arr(get('constituents')),modern:get('modern'),safety:get('safety'),classicalReferences:get('classicalReferences'),images:get('images').split(/\n+/).map(url=>url.trim()).filter(Boolean).map(url=>({url,caption:name,credit:'Added by library editor'}))};const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');saved.edits=saved.edits||{};saved.deleted=(saved.deleted||[]).filter(x=>x!==id);saved.edits[id]=d;localStorage.setItem(storageKey,JSON.stringify(saved));const i=state.drugs.findIndex(x=>x.id===id);if(i>=0)state.drugs[i]=d;else state.drugs.push(d);closeForm();render();alert('Drug saved successfully in this browser.');}
function deleteDrug(id){const d=state.drugs.find(x=>x.id===id);if(!d)return;if(!confirm(`Delete ${d.name} from this browser's library? This can be undone only by clearing the local override.`))return;const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');saved.deleted=saved.deleted||[];if(!saved.deleted.includes(id))saved.deleted.push(id);saved.edits=saved.edits||{};delete saved.edits[id];localStorage.setItem(storageKey,JSON.stringify(saved));state.drugs=state.drugs.filter(x=>x.id!==id);closeDetail();render();}
load();
</script></body></html>
